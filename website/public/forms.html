<!DOCTYPE html>
<html>
  <body>
    <!-- Static shadow form for @netlify/plugin-nextjs@5 Netlify Forms detection.
         Mirrors the "contact" form in app/contact/page.tsx. -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="topic">
        <option value="senior-role">Senior technical role</option>
        <option value="programme-leadership">Embedded programme leadership</option>
        <option value="technical-review">Independent technical review</option>
        <option value="other">Something else</option>
      </select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
